name: CoderApp
options:
  bundleIdPrefix: com.coder
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  CoderApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/AppShell
    dependencies:
      - package: CoderKit
      - package: CoderAuth
      - package: TerminalFeature
      - package: WebAppFeature
      - package: CoderUI
    settings:
      base:
        INFOPLIST_FILE: Sources/AppShell/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.coder.ios
        CODE_SIGN_STYLE: Automatic

packages:
  CoderKit:
    path: Modules/CoderKit
  CoderAuth:
    path: Modules/CoderAuth
  TerminalFeature:
    path: Modules/TerminalFeature
  WebAppFeature:
    path: Modules/WebAppFeature
  CoderUI:
    path: Modules/CoderUI
